name: CI

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Ruff
        run: pipx run ruff==0.16.8 check --output-format github .
      - name: Manifest version
        run: python3 tests/ci/check_version.py

  pr-title:
    # Squash-merge titles drive release-please, so they must be Conventional Commits.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ github.token }}

  test:
    name: test (${{ matrix.blender }})
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        blender: ["5.0", "5.2"] # minimum supported, current LTS
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-blender
        with:
          series: ${{ matrix.blender }}
      - name: Validate extension
        run: blender --command extension validate smart_retopo
      - name: End-to-end pipeline test
        run: blender -b --factory-startup --python-exit-code 1 -P tests/test_pipeline.py
      - name: Build extension
        run: mkdir -p dist && blender --command extension build --source-dir smart_retopo --output-dir dist
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-output-blender-${{ matrix.blender }}
          path: tests/_output/
          retention-days: 7
